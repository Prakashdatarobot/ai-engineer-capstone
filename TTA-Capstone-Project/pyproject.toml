[project]
name = "TTA-Capstone-Project"
version = "0.1.0"
description = "Ingest support tickets from CSV, write JSON, and count tickets per queue."
readme = "README.md"
authors = [
    { name = "Prakashdatarobot", email = "prakash.narayanasamy@datarobot.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tta-capstone-project = "tta_capstone_project.ingest:cli"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==8.3.3",
]
