[project]
name = "TTA-Capstone-Project"
version = "0.1.0"
description = "Ingest support tickets from CSV, write JSON, and count tickets per queue."
readme = "README.md"
authors = [
    { name = "Prakashdatarobot", email = "prakash.narayanasamy@datarobot.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datarobot>=3.20.0",
    "dr>=1.9.3",
    "ipython>=9.18.1",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
tta-capstone-project = "tta_capstone_project.ingest:cli"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==8.3.3",
]
